<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 424" width="800" height="424" role="img" aria-labelledby="ch03-activation-title" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <title id="ch03-activation-title">relu, sigmoid, softmax 세 활성화 함수의 모양과 출력 범위, 사용 위치를 비교한 3분할 개념 그래프. relu는 음수 구간이 0인 꺾은선, sigmoid는 0에서 1 사이의 S자 곡선, softmax는 합이 1인 막대 3개로 표현</title>

  <rect x="0" y="0" width="800" height="424" fill="#ffffff"/>

  <text x="32" y="44" font-size="20" font-weight="700" fill="#1a2332">주요 활성화 함수의 모양과 사용 위치</text>

  <!-- 패널 테두리 -->
  <g fill="#ffffff" stroke="#94a3b8" stroke-width="1" opacity="0.9">
    <rect x="32" y="84" width="232" height="286" rx="10"/>
    <rect x="284" y="84" width="232" height="286" rx="10"/>
    <rect x="536" y="84" width="232" height="286" rx="10"/>
  </g>

  <!-- 패널 제목 -->
  <g font-size="16" text-anchor="middle" fill="#2563eb" font-family="'SFMono-Regular','Consolas','D2Coding',monospace">
    <text x="148" y="114">relu</text>
    <text x="400" y="114">sigmoid</text>
    <text x="652" y="114">softmax</text>
  </g>

  <!-- 패널 1: relu -->
  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="60" y1="255" x2="240" y2="255"/>
    <line x1="148" y1="150" x2="148" y2="275"/>
  </g>
  <polyline points="60,255 148,255 236,163" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="140" y="272" font-size="12" fill="#94a3b8" text-anchor="end">0</text>
  <text x="148" y="305" font-size="13" fill="#1a2332" text-anchor="middle">출력 범위: 0 이상</text>
  <rect x="73" y="322" width="150" height="30" rx="10" fill="#dbeafe"/>
  <text x="148" y="342" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="600">은닉층 기본값</text>

  <!-- 패널 2: sigmoid -->
  <line x1="312" y1="159" x2="492" y2="159" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>
  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="312" y1="251" x2="492" y2="251"/>
    <line x1="402" y1="150" x2="402" y2="275"/>
  </g>
  <polyline points="312,250.8 327,250.4 342,249.3 357,246.7 372,240.1 387,226.3 402,205 417,183.7 432,170 447,163.3 462,160.7 477,159.6 492,159.2"
            fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="306" y="163" font-size="12" fill="#94a3b8" text-anchor="end">1</text>
  <text x="306" y="255" font-size="12" fill="#94a3b8" text-anchor="end">0</text>
  <text x="400" y="305" font-size="13" fill="#1a2332" text-anchor="middle">출력 범위: 0 ~ 1 (값 1개)</text>
  <rect x="325" y="322" width="150" height="30" rx="10" fill="#dbeafe"/>
  <text x="400" y="342" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="600">이진분류 출력층</text>

  <!-- 패널 3: softmax -->
  <text x="652" y="150" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="600">합 = 1.00</text>
  <g fill="#dbeafe" stroke="#2563eb" stroke-width="2">
    <rect x="576" y="233" width="36" height="22"/>
    <rect x="634" y="195" width="36" height="60"/>
    <rect x="692" y="242" width="36" height="13"/>
  </g>
  <line x1="566" y1="255" x2="738" y2="255" stroke="#94a3b8" stroke-width="1.5"/>
  <g font-size="12" fill="#1a2332" text-anchor="middle">
    <text x="594" y="225">0.23</text>
    <text x="652" y="187">0.63</text>
    <text x="710" y="234">0.14</text>
  </g>
  <g font-size="12" fill="#94a3b8" text-anchor="middle">
    <text x="594" y="273">클래스 1</text>
    <text x="652" y="273">클래스 2</text>
    <text x="710" y="273">클래스 3</text>
  </g>
  <text x="652" y="305" font-size="13" fill="#1a2332" text-anchor="middle">출력 범위: 0 ~ 1, 합 = 1</text>
  <rect x="577" y="322" width="150" height="30" rx="10" fill="#dbeafe"/>
  <text x="652" y="342" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="600">다중분류 출력층</text>

  <!-- 주석 -->
  <text x="32" y="398" font-size="12" fill="#94a3b8">※ 개념 개략도이며 실제 측정값 그래프가 아닙니다. softmax 막대는 본문 예시 z = [1.0, 2.0, 0.5]의 계산 결과입니다.</text>
</svg>
