<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" role="img" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <title>스케일러 fit 시점과 데이터 누수 — 전체 데이터에 fit하면 누수가 생기고, 먼저 분리한 뒤 학습 데이터에만 fit_transform, 평가 데이터에는 transform만 해야 한다</title>
  <defs>
    <marker id="ch02sl-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1a2332"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="430" fill="#ffffff"/>

  <text x="24" y="40" font-size="20" font-weight="bold" fill="#1a2332">스케일러 fit 시점과 데이터 누수</text>

  <!-- ===== 위: 누수가 생기는 순서 ===== -->
  <circle cx="34" cy="72" r="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <line x1="29.5" y1="67.5" x2="38.5" y2="76.5" stroke="#dc2626" stroke-width="2"/>
  <line x1="38.5" y1="67.5" x2="29.5" y2="76.5" stroke="#dc2626" stroke-width="2"/>
  <text x="52" y="78" font-size="15" font-weight="bold" fill="#dc2626">누수가 생기는 순서</text>

  <rect x="60" y="96" width="170" height="64" rx="10" fill="#ffffff" stroke="#1a2332" stroke-width="1.5"/>
  <text x="145" y="133" font-size="15" text-anchor="middle" fill="#1a2332">전체 데이터</text>

  <line x1="230" y1="128" x2="266" y2="128" stroke="#1a2332" stroke-width="2" marker-end="url(#ch02sl-arrow)"/>

  <rect x="268" y="96" width="252" height="64" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="394" y="122" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#dc2626">전체 데이터로 fit</text>
  <text x="394" y="146" font-size="12.5" text-anchor="middle" fill="#1a2332" font-family="'SFMono-Regular', Menlo, Consolas, monospace">scaler.fit_transform(X)</text>

  <line x1="520" y1="128" x2="556" y2="128" stroke="#1a2332" stroke-width="2" marker-end="url(#ch02sl-arrow)"/>

  <rect x="558" y="96" width="218" height="64" rx="10" fill="#ffffff" stroke="#1a2332" stroke-width="1.5"/>
  <text x="667" y="122" font-size="14.5" text-anchor="middle" fill="#1a2332">그다음 분리</text>
  <text x="667" y="146" font-size="12.5" text-anchor="middle" fill="#1a2332" font-family="'SFMono-Regular', Menlo, Consolas, monospace">train_test_split(...)</text>

  <text x="60" y="190" font-size="12.5" fill="#dc2626">평가 데이터의 평균 · 표준편차가 변환 규칙에 섞여 들어감 = 데이터 누수</text>

  <line x1="24" y1="214" x2="776" y2="214" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- ===== 아래: 올바른 순서 ===== -->
  <circle cx="34" cy="246" r="10" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <path d="M29,246 L33,251 L40,241" fill="none" stroke="#059669" stroke-width="2"/>
  <text x="52" y="252" font-size="15" font-weight="bold" fill="#059669">올바른 순서</text>

  <rect x="60" y="268" width="170" height="64" rx="10" fill="#ffffff" stroke="#1a2332" stroke-width="1.5"/>
  <text x="145" y="305" font-size="15" text-anchor="middle" fill="#1a2332">전체 데이터</text>

  <line x1="230" y1="300" x2="266" y2="300" stroke="#1a2332" stroke-width="2" marker-end="url(#ch02sl-arrow)"/>

  <rect x="268" y="268" width="218" height="64" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="377" y="294" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#059669">먼저 분리</text>
  <text x="377" y="318" font-size="12.5" text-anchor="middle" fill="#1a2332" font-family="'SFMono-Regular', Menlo, Consolas, monospace">train_test_split(...)</text>

  <path d="M486,300 H514 V264 H554" fill="none" stroke="#1a2332" stroke-width="2" marker-end="url(#ch02sl-arrow)"/>
  <path d="M486,300 H514 V336 H554" fill="none" stroke="#1a2332" stroke-width="2" marker-end="url(#ch02sl-arrow)"/>

  <rect x="556" y="234" width="220" height="60" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="666" y="260" font-size="14" text-anchor="middle" fill="#1a2332">학습 데이터 — 계산 + 변환</text>
  <text x="666" y="282" font-size="12.5" text-anchor="middle" fill="#059669" font-family="'SFMono-Regular', Menlo, Consolas, monospace">fit_transform(X_train)</text>

  <rect x="556" y="306" width="220" height="60" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="666" y="332" font-size="14" text-anchor="middle" fill="#1a2332">평가 데이터 — 변환만</text>
  <text x="666" y="354" font-size="12.5" text-anchor="middle" fill="#059669" font-family="'SFMono-Regular', Menlo, Consolas, monospace">transform(X_test)</text>

  <text x="60" y="398" font-size="12.5" fill="#059669">학습 데이터에서 계산한 평균 · 표준편차만 사용 = 누수 없음</text>
</svg>
