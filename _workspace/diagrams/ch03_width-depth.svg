  <title id="ch03-wd-title">층 수와 노드 수가 모델에 미치는 영향을 좌우로 비교한 구조도. 왼쪽은 은닉층 1개에 노드 3개인 작은 모델로 표현력이 부족하고, 오른쪽은 은닉층 3개에 노드 8개인 큰 모델로 표현력은 크지만 과적합 위험이 있다</title>

