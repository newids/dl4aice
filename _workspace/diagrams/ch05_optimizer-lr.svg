<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 356" width="800" height="356" role="img" aria-label="학습률에 따른 수렴 모습">
  <title>학습률에 따른 수렴 모습 — U자 손실 골짜기를 내려가는 공의 궤적을 세 패널로 비교한다. 학습률이 너무 작으면 걸음이 짧아 바닥에 닿지 못하고, 적절하면 바닥에 안정적으로 수렴하며, 너무 크면 바닥을 지나쳐 점점 크게 튀며 발산한다.</title>
  <defs>
    <marker id="lr-arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="lr-arrow-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#059669"/>
    </marker>
    <marker id="lr-arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="356" fill="#ffffff"/>

  <g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">

    <text x="32" y="38" font-size="20" font-weight="700" fill="#1a2332">학습률에 따른 수렴 모습</text>

    <!-- ===== 패널 1: 너무 작음 ===== -->
    <rect x="32" y="64" width="224" height="220" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="144" y="92" font-size="14" font-weight="700" fill="#1a2332" text-anchor="middle">보폭이 너무 작다</text>
    <text x="144" y="112" font-size="11" fill="#94a3b8" text-anchor="middle">learning_rate 너무 작음</text>
    <path d="M52 150 Q144 350 236 150" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <polyline points="63,172.6 74.1,192.2 85.1,209 96.2,223 107.2,234 118.2,242.2" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#lr-arrow-muted)"/>
    <g fill="#94a3b8">
      <circle cx="63" cy="172.6" r="4"/>
      <circle cx="74.1" cy="192.2" r="4"/>
      <circle cx="85.1" cy="209" r="4"/>
      <circle cx="96.2" cy="223" r="4"/>
      <circle cx="107.2" cy="234" r="4"/>
    </g>
    <text x="144" y="274" font-size="12" fill="#94a3b8" text-anchor="middle">느리게 수렴</text>

    <!-- ===== 패널 2: 적절 ===== -->
    <rect x="288" y="64" width="224" height="220" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2"/>
    <text x="400" y="92" font-size="14" font-weight="700" fill="#1a2332" text-anchor="middle">보폭이 적절하다</text>
    <text x="400" y="112" font-size="11" fill="#94a3b8" text-anchor="middle">learning_rate=0.001 (Adam 기본값)</text>
    <path d="M308 150 Q400 350 492 150" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <polyline points="322.7,179.4 352.2,223 381.6,246 400,250" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#lr-arrow-success)"/>
    <g fill="#059669">
      <circle cx="322.7" cy="179.4" r="4"/>
      <circle cx="352.2" cy="223" r="4"/>
      <circle cx="381.6" cy="246" r="4"/>
      <circle cx="400" cy="250" r="6"/>
    </g>
    <text x="400" y="274" font-size="12" fill="#059669" text-anchor="middle">안정적으로 수렴</text>

    <!-- ===== 패널 3: 너무 큼 ===== -->
    <rect x="544" y="64" width="224" height="220" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <text x="656" y="92" font-size="14" font-weight="700" fill="#1a2332" text-anchor="middle">보폭이 너무 크다</text>
    <text x="656" y="112" font-size="11" fill="#94a3b8" text-anchor="middle">learning_rate 너무 큼</text>
    <path d="M564 150 Q656 350 748 150" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <polyline points="628.4,241 689.1,237 600.8,214 720.4,201 575,172.6 742.5,161.6" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#lr-arrow-danger)"/>
    <g fill="#dc2626">
      <circle cx="628.4" cy="241" r="4"/>
      <circle cx="689.1" cy="237" r="4"/>
      <circle cx="600.8" cy="214" r="4"/>
      <circle cx="720.4" cy="201" r="4"/>
      <circle cx="575" cy="172.6" r="4"/>
    </g>
    <text x="656" y="274" font-size="12" fill="#dc2626" text-anchor="middle">튀거나 발산 (nan)</text>

    <text x="32" y="316" font-size="12" fill="#94a3b8">개념 개략도입니다. 세로 방향이 손실(loss)이고 공은 현재 가중치 상태입니다.</text>
    <text x="32" y="338" font-size="12" fill="#94a3b8">학습률은 한 걸음의 보폭입니다. 시험에서는 optimizer='adam' 기본값을 그대로 쓰십시오.</text>
  </g>
</svg>
