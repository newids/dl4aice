<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 456" width="800" height="456" role="img" aria-label="혼동 행렬의 네 칸 읽는 법">
  <title>혼동 행렬의 네 칸 읽는 법 — 행은 실제, 열은 예측이며 배치는 왼쪽 위부터 TN, FP, FN, TP 순이다. 정밀도는 예측 1 열, 재현율은 실제 1 행 방향으로 계산한다.</title>
  <defs>
    <marker id="ch07cm-arrow-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="ch07cm-arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="456" fill="#ffffff"/>

  <g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">

    <text x="32" y="38" font-size="20" font-weight="700" fill="#1a2332">혼동 행렬의 네 칸 읽는 법</text>
    <text x="32" y="62" font-size="13" fill="#94a3b8">confusion_matrix(y_test, y_pred) — 행은 실제, 열은 예측. 배치는 [[TN, FP], [FN, TP]]</text>

    <!-- 축 라벨 -->
    <text x="350" y="96" font-size="13" fill="#94a3b8" text-anchor="middle">예측 (predicted)</text>
    <text x="265" y="124" font-size="14" font-weight="700" fill="#1a2332" text-anchor="middle">예측 0</text>
    <text x="435" y="124" font-size="14" font-weight="700" fill="#1a2332" text-anchor="middle">예측 1</text>
    <text x="112" y="238" font-size="13" fill="#94a3b8" text-anchor="middle" transform="rotate(-90 112 238)">실제 (actual)</text>
    <text x="170" y="194" font-size="14" font-weight="700" fill="#1a2332" text-anchor="end">실제 0</text>
    <text x="170" y="292" font-size="14" font-weight="700" fill="#1a2332" text-anchor="end">실제 1</text>

    <!-- TN -->
    <rect x="182" y="142" width="166" height="94" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="265" y="170" font-size="17" font-weight="700" fill="#1a2332" text-anchor="middle">TN</text>
    <text x="265" y="194" font-size="12" fill="#94a3b8" text-anchor="middle">실제 0 을 0 으로 맞힘</text>
    <text x="265" y="224" font-size="20" font-weight="700" fill="#1a2332" text-anchor="middle">63</text>

    <!-- FP -->
    <rect x="352" y="142" width="166" height="94" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <text x="435" y="170" font-size="17" font-weight="700" fill="#dc2626" text-anchor="middle">FP</text>
    <text x="435" y="194" font-size="12" fill="#dc2626" text-anchor="middle">실제 0 인데 1 로 잘못 봄</text>
    <text x="435" y="224" font-size="20" font-weight="700" fill="#dc2626" text-anchor="middle">1</text>

    <!-- FN -->
    <rect x="182" y="240" width="166" height="94" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <text x="265" y="268" font-size="17" font-weight="700" fill="#dc2626" text-anchor="middle">FN</text>
    <text x="265" y="292" font-size="12" fill="#dc2626" text-anchor="middle">실제 1 인데 0 으로 놓침</text>
    <text x="265" y="322" font-size="20" font-weight="700" fill="#dc2626" text-anchor="middle">4</text>

    <!-- TP -->
    <rect x="352" y="240" width="166" height="94" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="435" y="268" font-size="17" font-weight="700" fill="#1a2332" text-anchor="middle">TP</text>
    <text x="435" y="292" font-size="12" fill="#94a3b8" text-anchor="middle">실제 1 을 1 로 맞힘</text>
    <text x="435" y="322" font-size="20" font-weight="700" fill="#1a2332" text-anchor="middle">103</text>

    <!-- 정밀도: 예측 1 열 방향 (세로) -->
    <line x1="546" y1="152" x2="546" y2="324" stroke="#2563eb" stroke-width="2"
          marker-start="url(#ch07cm-arrow-p)" marker-end="url(#ch07cm-arrow-p)"/>
    <text x="572" y="214" font-size="15" font-weight="700" fill="#2563eb">정밀도</text>
    <text x="572" y="238" font-size="14" fill="#1a2332">TP / (TP + FP)</text>
    <text x="572" y="260" font-size="12" fill="#94a3b8">예측 1 열 기준</text>

    <!-- 재현율: 실제 1 행 방향 (가로) -->
    <line x1="194" y1="352" x2="506" y2="352" stroke="#f59e0b" stroke-width="2"
          marker-start="url(#ch07cm-arrow-a)" marker-end="url(#ch07cm-arrow-a)"/>
    <text x="350" y="380" font-size="14" text-anchor="middle"><tspan fill="#f59e0b" font-weight="700">재현율</tspan><tspan fill="#1a2332"> = TP / (TP + FN)</tspan></text>
    <text x="350" y="400" font-size="12" fill="#94a3b8" text-anchor="middle">실제 1 행 기준</text>

    <text x="32" y="430" font-size="12" fill="#94a3b8">숫자는 7.3 예제의 결과입니다. 인자 순서를 바꾸면 행렬이 전치되어 FP 와 FN 이 뒤바뀝니다.</text>
  </g>
</svg>
