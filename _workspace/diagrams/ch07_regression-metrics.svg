<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 424" width="800" height="424" role="img" aria-label="회귀 지표 mse, mae, r2 의 초점 차이">
  <title>회귀 지표 mse, mae, r2의 초점 차이 — 실제값 대비 예측값 산점도에서 기준선까지의 세로 거리가 잔차이며, mse는 큰 오차에 크게 반응하고 mae는 평균 오차 크기를, r2는 설명력을 나타낸다.</title>

  <rect x="0" y="0" width="800" height="424" fill="#ffffff"/>

  <g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">

    <text x="32" y="38" font-size="20" font-weight="700" fill="#1a2332">회귀 지표 mse, mae, r2 의 초점 차이</text>

    <!-- ===== 왼쪽: 산점도 개략도 ===== -->
    <text x="312" y="88" font-size="12" fill="#94a3b8" text-anchor="end">예측 = 실제 기준선</text>

    <line x1="80" y1="90" x2="80" y2="320" stroke="#1a2332" stroke-width="1.5"/>
    <line x1="80" y1="320" x2="356" y2="320" stroke="#1a2332" stroke-width="1.5"/>
    <text x="218" y="346" font-size="13" fill="#1a2332" text-anchor="middle">실제값</text>
    <text x="54" y="205" font-size="13" fill="#1a2332" text-anchor="middle" transform="rotate(-90 54 205)">예측값</text>

    <line x1="95" y1="315" x2="315" y2="95" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>

    <!-- 잔차 -->
    <g stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3">
      <line x1="125" y1="285" x2="125" y2="268"/>
      <line x1="160" y1="250" x2="160" y2="262"/>
      <line x1="195" y1="215" x2="195" y2="204"/>
      <line x1="230" y1="180" x2="230" y2="196"/>
      <line x1="265" y1="145" x2="265" y2="133"/>
    </g>
    <line x1="300" y1="110" x2="300" y2="156" stroke="#dc2626" stroke-width="2.5"/>

    <!-- 예측 점 -->
    <g fill="#2563eb">
      <circle cx="125" cy="268" r="5"/>
      <circle cx="160" cy="262" r="5"/>
      <circle cx="195" cy="204" r="5"/>
      <circle cx="230" cy="196" r="5"/>
      <circle cx="265" cy="133" r="5"/>
    </g>
    <circle cx="300" cy="156" r="5" fill="#dc2626"/>
    <text x="300" y="180" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">잔차가 큰 샘플</text>

    <!-- ===== 오른쪽: 지표 표 ===== -->
    <rect x="404" y="88" width="364" height="78" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="428" y="114" font-size="17" font-weight="700" fill="#2563eb">mse</text>
    <text x="428" y="138" font-size="13" fill="#1a2332">잔차를 제곱해 평균 — 큰 오차에 크게 반응</text>
    <text x="428" y="158" font-size="12" fill="#94a3b8">작을수록 좋음</text>

    <rect x="404" y="174" width="364" height="78" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="428" y="200" font-size="17" font-weight="700" fill="#2563eb">mae</text>
    <text x="428" y="224" font-size="13" fill="#1a2332">잔차의 절댓값 평균 — 평균적인 오차 크기</text>
    <text x="428" y="244" font-size="12" fill="#94a3b8">작을수록 좋음</text>

    <rect x="404" y="260" width="364" height="78" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="428" y="286" font-size="17" font-weight="700" fill="#2563eb">r2</text>
    <text x="428" y="310" font-size="13" fill="#1a2332">타깃 분산 중 모델이 설명한 비율</text>
    <text x="428" y="330" font-size="12" fill="#94a3b8">1 에 가까울수록 좋음, 음수도 가능</text>

    <text x="32" y="376" font-size="13" fill="#1a2332">잔차가 큰 샘플 하나에 mse 는 크게 반응하고, mae 는 완만하게 반응합니다.</text>
    <text x="32" y="398" font-size="12" fill="#94a3b8">왼쪽 그림은 개략도입니다 — 실제 데이터가 아닙니다.</text>
  </g>
</svg>
