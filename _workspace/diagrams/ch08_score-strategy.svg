<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 412" width="800" height="412" role="img" aria-label="부분 점수를 지키는 답안 구성" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <title>부분 점수를 지키는 답안 구성 — 전 과정을 한 셀에 몰아 쓰면 오류 하나로 셀 전체가 실패해 화면에 남는 출력이 없지만, 단계별로 셀을 나누고 셀 끝마다 print를 남기면 실패한 셀 앞 단계의 출력은 그대로 남는다.</title>

  <rect x="0" y="0" width="800" height="412" fill="#ffffff"/>

  <text x="24" y="38" font-size="20" font-weight="bold" fill="#1a2332">부분 점수를 지키는 답안 구성</text>

  <!-- 중앙 구분선 -->
  <line x1="400" y1="58" x2="400" y2="360" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- ===== 왼쪽: 한 셀에 몰아 쓰기 ===== -->
  <circle cx="34" cy="74" r="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <line x1="29.5" y1="69.5" x2="38.5" y2="78.5" stroke="#dc2626" stroke-width="2"/>
  <line x1="38.5" y1="69.5" x2="29.5" y2="78.5" stroke="#dc2626" stroke-width="2"/>
  <text x="52" y="80" font-size="15" font-weight="bold" fill="#dc2626">한 셀에 몰아 쓰기</text>

  <rect x="24" y="96" width="360" height="172" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="42" y="122" font-size="11" fill="#94a3b8" font-family="'SFMono-Regular', Menlo, Consolas, monospace">In [1]</text>

  <text x="44" y="150" font-size="13.5" fill="#1a2332">전처리</text>
  <text x="44" y="178" font-size="13.5" fill="#1a2332">모델 구성</text>
  <text x="44" y="206" font-size="13.5" fill="#1a2332">학습</text>
  <text x="44" y="234" font-size="13.5" fill="#1a2332">평가 · print()</text>

  <circle cx="150" cy="173" r="9" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <line x1="146.5" y1="169.5" x2="153.5" y2="176.5" stroke="#dc2626" stroke-width="2"/>
  <line x1="153.5" y1="169.5" x2="146.5" y2="176.5" stroke="#dc2626" stroke-width="2"/>
  <text x="166" y="178" font-size="12" font-weight="bold" fill="#dc2626">여기서 오류</text>

  <text x="44" y="256" font-size="11" fill="#dc2626">오류 하나로 셀 전체가 실패합니다</text>

  <text x="24" y="292" font-size="12" fill="#dc2626">앞 단계까지 잘 썼어도 화면에 결과가 남지 않습니다.</text>

  <rect x="24" y="308" width="360" height="44" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="204" y="336" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">화면에 남는 출력 — 없음</text>

  <!-- ===== 오른쪽: 단계별 셀 분리 ===== -->
  <circle cx="426" cy="74" r="10" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <path d="M421,74 L425,79 L432,69" fill="none" stroke="#059669" stroke-width="2"/>
  <text x="444" y="80" font-size="15" font-weight="bold" fill="#059669">단계별 셀 분리</text>

  <!-- 셀 1 -->
  <rect x="416" y="96" width="360" height="38" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="432" y="120" font-size="12.5" fill="#1a2332">1. 전처리</text>
  <text x="524" y="120" font-size="11" fill="#94a3b8" font-family="'SFMono-Regular', Menlo, Consolas, monospace">print(df.isnull().sum())</text>
  <circle cx="754" cy="115" r="9" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <path d="M749,115 L753,120 L760,110" fill="none" stroke="#059669" stroke-width="2"/>

  <!-- 셀 2 -->
  <rect x="416" y="140" width="360" height="38" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="432" y="164" font-size="12.5" fill="#1a2332">2. 분리 · 스케일링</text>
  <text x="560" y="164" font-size="11" fill="#94a3b8" font-family="'SFMono-Regular', Menlo, Consolas, monospace">print(X_train_scaled.shape)</text>
  <circle cx="754" cy="159" r="9" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <path d="M749,159 L753,164 L760,154" fill="none" stroke="#059669" stroke-width="2"/>

  <!-- 셀 3 -->
  <rect x="416" y="184" width="360" height="38" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="432" y="208" font-size="12.5" fill="#1a2332">3. 모델 구성</text>
  <text x="540" y="208" font-size="11" fill="#dc2626" font-family="'SFMono-Regular', Menlo, Consolas, monospace">ValueError</text>
  <circle cx="754" cy="203" r="9" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <line x1="750.5" y1="199.5" x2="757.5" y2="206.5" stroke="#dc2626" stroke-width="2"/>
  <line x1="757.5" y1="199.5" x2="750.5" y2="206.5" stroke="#dc2626" stroke-width="2"/>

  <!-- 셀 4 -->
  <rect x="416" y="228" width="360" height="38" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="432" y="252" font-size="12.5" fill="#94a3b8">4. 학습 · 평가</text>
  <text x="552" y="252" font-size="11" fill="#94a3b8">3번을 고친 뒤 이어서 실행</text>
  <line x1="745" y1="247" x2="763" y2="247" stroke="#94a3b8" stroke-width="2"/>

  <text x="416" y="292" font-size="12" fill="#059669">3번 셀만 실패하고 1 · 2번의 출력은 화면에 그대로 남습니다.</text>

  <rect x="416" y="308" width="360" height="44" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="596" y="336" font-size="13" font-weight="bold" text-anchor="middle" fill="#059669">화면에 남는 출력 — 1 · 2단계</text>

  <text x="24" y="388" font-size="12" fill="#94a3b8">셀 끝마다 print()로 결과를 남기십시오 — 채점자가 보는 것은 화면에 출력된 결과입니다.</text>
</svg>
