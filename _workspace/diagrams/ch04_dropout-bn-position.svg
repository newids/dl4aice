<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 630" width="800" height="630" role="img" aria-label="Dropout과 BatchNormalization을 넣는 위치" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <title>Dropout과 BatchNormalization을 넣는 위치. 은닉층 Dense 뒤에 BatchNormalization, 그 뒤에 Dropout을 두며 출력층 뒤에는 넣지 않습니다.</title>
  <defs>
    <marker id="dbp-p-e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="dbp-d-e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="630" fill="#ffffff"/>

  <text x="32" y="38" font-size="20" font-weight="700" fill="#1a2332">보조 층을 넣는 위치</text>

  <!-- 은닉 블록 표시 -->
  <path d="M242,126 H230 V306 H242" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <text x="214" y="204" font-size="12" font-weight="700" fill="#1a2332" text-anchor="end">은닉층 블록</text>
  <text x="214" y="222" font-size="12" fill="#94a3b8" text-anchor="end">Dense 뒤에 BN,</text>
  <text x="214" y="240" font-size="12" fill="#94a3b8" text-anchor="end">그 뒤에 Dropout</text>

  <!-- 1 Input -->
  <rect x="256" y="58" width="288" height="44" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="400" y="86" font-size="14" fill="#94a3b8" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Consolas, monospace">Input(shape=(30,))</text>
  <line x1="400" y1="104" x2="400" y2="124" stroke="#94a3b8" stroke-width="2" marker-end="url(#dbp-p-e)"/>

  <!-- 2 Dense 64 -->
  <rect x="256" y="126" width="288" height="44" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="154" font-size="14" fill="#1a2332" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Consolas, monospace">Dense(64, activation='relu')</text>
  <line x1="400" y1="172" x2="400" y2="192" stroke="#94a3b8" stroke-width="2" marker-end="url(#dbp-p-e)"/>

  <!-- 3 BatchNormalization -->
  <rect x="256" y="194" width="288" height="44" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="400" y="222" font-size="14" fill="#1a2332" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Consolas, monospace">BatchNormalization()</text>
  <text x="566" y="221" font-size="12" fill="#94a3b8">값의 분포를 정돈</text>
  <line x1="400" y1="240" x2="400" y2="260" stroke="#94a3b8" stroke-width="2" marker-end="url(#dbp-p-e)"/>

  <!-- 4 Dropout -->
  <rect x="256" y="262" width="288" height="44" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="400" y="290" font-size="14" fill="#1a2332" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Consolas, monospace">Dropout(0.3)</text>
  <text x="566" y="278" font-size="12" fill="#94a3b8">노드 일부를 끔</text>
  <text x="566" y="296" font-size="12" fill="#94a3b8">0.3 = 끄는 비율</text>
  <line x1="400" y1="308" x2="400" y2="328" stroke="#94a3b8" stroke-width="2" marker-end="url(#dbp-p-e)"/>

  <!-- 5 Dense 32 -->
  <rect x="256" y="330" width="288" height="44" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="358" font-size="14" fill="#1a2332" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Consolas, monospace">Dense(32, activation='relu')</text>
  <line x1="400" y1="376" x2="400" y2="396" stroke="#94a3b8" stroke-width="2" marker-end="url(#dbp-p-e)"/>

  <!-- 6 Dropout -->
  <rect x="256" y="398" width="288" height="44" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="400" y="426" font-size="14" fill="#1a2332" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Consolas, monospace">Dropout(0.3)</text>
  <line x1="400" y1="444" x2="400" y2="464" stroke="#94a3b8" stroke-width="2" marker-end="url(#dbp-p-e)"/>

  <!-- 7 출력층 -->
  <rect x="256" y="466" width="288" height="44" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="494" font-size="14" fill="#1a2332" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Consolas, monospace">Dense(1, activation='sigmoid')</text>
  <text x="566" y="493" font-size="12" fill="#94a3b8">출력층</text>
  <line x1="400" y1="512" x2="400" y2="532" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#dbp-d-e)"/>

  <!-- 8 금지 -->
  <rect x="256" y="534" width="288" height="44" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="400" y="562" font-size="14" fill="#dc2626" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Consolas, monospace">Dropout(0.3)</text>
  <circle cx="222" cy="556" r="13" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <line x1="216" y1="550" x2="228" y2="562" stroke="#dc2626" stroke-width="2"/>
  <line x1="228" y1="550" x2="216" y2="562" stroke="#dc2626" stroke-width="2"/>
  <text x="566" y="552" font-size="13" font-weight="700" fill="#dc2626">출력층 뒤에는</text>
  <text x="566" y="570" font-size="13" font-weight="700" fill="#dc2626">넣지 않는다</text>

  <text x="400" y="606" font-size="12" fill="#94a3b8" text-anchor="middle">보조 층은 은닉층 Dense 뒤에만 넣는다. 순서는 Dense, BatchNormalization, Dropout.</text>
</svg>
