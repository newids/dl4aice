<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 294" width="800" height="294" role="img" aria-label="90분 시험 시간 배분 예시">
  <title>90분 시험 시간 배분 예시 — 탐색 15분, 전처리 25분, 머신러닝 15분, 딥러닝 25분, 검토 10분으로 나눈 가로 타임라인. 딥러닝 구간을 먼저 확보한다.</title>

  <rect x="0" y="0" width="800" height="294" fill="#ffffff"/>

  <g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">

    <text x="32" y="38" font-size="20" font-weight="700" fill="#1a2332">90분 시험 시간 배분 예시</text>

    <!-- 딥러닝 구간 브래킷 -->
    <path d="M480 104 L480 96 L680 96 L680 104" fill="none" stroke="#2563eb" stroke-width="2"/>
    <text x="580" y="88" font-size="13" font-weight="700" fill="#2563eb" text-anchor="middle">먼저 확보할 구간</text>

    <!-- 구간명 -->
    <text x="100" y="136" font-size="15" fill="#1a2332" text-anchor="middle">탐색</text>
    <text x="260" y="136" font-size="15" fill="#1a2332" text-anchor="middle">전처리</text>
    <text x="420" y="136" font-size="15" fill="#1a2332" text-anchor="middle">머신러닝</text>
    <text x="580" y="136" font-size="15" font-weight="700" fill="#1a2332" text-anchor="middle">딥러닝</text>
    <text x="720" y="136" font-size="15" fill="#f59e0b" text-anchor="middle">검토</text>

    <!-- 막대: 딥러닝 구간 채움 -->
    <rect x="480" y="146" width="200" height="64" fill="#dbeafe"/>

    <!-- 구간 구분선 -->
    <g stroke="#94a3b8" stroke-width="1.5">
      <line x1="160" y1="146" x2="160" y2="210"/>
      <line x1="360" y1="146" x2="360" y2="210"/>
      <line x1="480" y1="146" x2="480" y2="210"/>
      <line x1="680" y1="146" x2="680" y2="210"/>
    </g>

    <!-- 막대 외곽 -->
    <rect x="40" y="146" width="720" height="64" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="480" y="146" width="200" height="64" fill="none" stroke="#2563eb" stroke-width="2.5"/>

    <!-- 구간 소요 시간 -->
    <text x="100" y="184" font-size="14" fill="#94a3b8" text-anchor="middle">15분</text>
    <text x="260" y="184" font-size="14" fill="#94a3b8" text-anchor="middle">25분</text>
    <text x="420" y="184" font-size="14" fill="#94a3b8" text-anchor="middle">15분</text>
    <text x="580" y="184" font-size="14" font-weight="700" fill="#2563eb" text-anchor="middle">25분</text>
    <text x="720" y="184" font-size="14" fill="#94a3b8" text-anchor="middle">10분</text>

    <!-- 누적 경과 눈금 -->
    <g stroke="#94a3b8" stroke-width="1">
      <line x1="40" y1="210" x2="40" y2="222"/>
      <line x1="160" y1="210" x2="160" y2="222"/>
      <line x1="360" y1="210" x2="360" y2="222"/>
      <line x1="480" y1="210" x2="480" y2="222"/>
      <line x1="680" y1="210" x2="680" y2="222"/>
      <line x1="760" y1="210" x2="760" y2="222"/>
    </g>
    <g font-size="12" fill="#94a3b8" text-anchor="middle">
      <text x="40" y="240">0분</text>
      <text x="160" y="240">15분</text>
      <text x="360" y="240">40분</text>
      <text x="480" y="240">55분</text>
      <text x="680" y="240">80분</text>
      <text x="760" y="240">90분</text>
    </g>

    <text x="32" y="270" font-size="12" fill="#94a3b8">예시 배분입니다. 딥러닝 몫을 먼저 떼어 놓고, 마지막 10분은 새 코드 없이 검토용으로 비워 둡니다.</text>
  </g>
</svg>
