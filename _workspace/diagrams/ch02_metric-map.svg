<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <title>문제 유형별 평가지표 지도 — 타깃이 범주면 분류 지표와 혼동 행렬을, 숫자면 회귀 지표를 고르고 대응하는 sklearn 함수를 함께 표기</title>
  <defs>
    <marker id="ch02mm-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1a2332"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="440" fill="#ffffff"/>

  <text x="24" y="40" font-size="20" font-weight="bold" fill="#1a2332">문제 유형별 평가지표 지도</text>

  <!-- 루트 질문 -->
  <polygon points="400,66 600,112 400,158 200,112" fill="#ffffff" stroke="#1a2332" stroke-width="2"/>
  <text x="400" y="118" font-size="15" text-anchor="middle" fill="#1a2332">타깃이 범주인가, 숫자인가?</text>

  <path d="M400,158 V176 H225 V188" fill="none" stroke="#1a2332" stroke-width="2" marker-end="url(#ch02mm-arrow)"/>
  <path d="M400,158 V176 H600 V188" fill="none" stroke="#1a2332" stroke-width="2" marker-end="url(#ch02mm-arrow)"/>
  <text x="300" y="170" font-size="12.5" text-anchor="middle" fill="#94a3b8">범주</text>
  <text x="500" y="170" font-size="12.5" text-anchor="middle" fill="#94a3b8">숫자</text>

  <!-- 분류 -->
  <rect x="125" y="190" width="200" height="52" rx="10" fill="#ffffff" stroke="#1a2332" stroke-width="1.5"/>
  <text x="225" y="214" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a2332">분류</text>
  <text x="225" y="232" font-size="11.5" text-anchor="middle" fill="#94a3b8">이진 · 다중</text>

  <!-- 회귀 -->
  <rect x="500" y="190" width="200" height="52" rx="10" fill="#ffffff" stroke="#1a2332" stroke-width="1.5"/>
  <text x="600" y="214" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a2332">회귀</text>
  <text x="600" y="232" font-size="11.5" text-anchor="middle" fill="#94a3b8">연속된 숫자</text>

  <path d="M225,242 V258 H125 V274" fill="none" stroke="#1a2332" stroke-width="2" marker-end="url(#ch02mm-arrow)"/>
  <path d="M225,242 V258 H331 V274" fill="none" stroke="#1a2332" stroke-width="2" marker-end="url(#ch02mm-arrow)"/>
  <path d="M600,242 V274" fill="none" stroke="#1a2332" stroke-width="2" marker-end="url(#ch02mm-arrow)"/>

  <!-- 분류 지표 -->
  <rect x="30" y="276" width="190" height="104" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="125" y="302" font-size="12.5" text-anchor="middle" fill="#1a2332" font-family="'SFMono-Regular', Menlo, Consolas, monospace">accuracy · precision</text>
  <text x="125" y="324" font-size="12.5" text-anchor="middle" fill="#1a2332" font-family="'SFMono-Regular', Menlo, Consolas, monospace">recall · f1</text>
  <text x="125" y="352" font-size="12" text-anchor="middle" fill="#1a2332" font-family="'SFMono-Regular', Menlo, Consolas, monospace">classification_report</text>
  <text x="125" y="371" font-size="12" text-anchor="middle" fill="#1a2332" font-family="'SFMono-Regular', Menlo, Consolas, monospace">accuracy_score</text>

  <!-- 혼동 행렬 -->
  <rect x="236" y="276" width="190" height="104" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="331" y="308" font-size="15" text-anchor="middle" fill="#1a2332">혼동 행렬</text>
  <text x="331" y="332" font-size="12" text-anchor="middle" fill="#1a2332">예측 분포 확인</text>
  <text x="331" y="362" font-size="12" text-anchor="middle" fill="#1a2332" font-family="'SFMono-Regular', Menlo, Consolas, monospace">confusion_matrix</text>

  <!-- 회귀 지표 -->
  <rect x="470" y="276" width="290" height="104" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="615" y="303" font-size="13" text-anchor="middle" fill="#1a2332" font-family="'SFMono-Regular', Menlo, Consolas, monospace">mse · mae · r2</text>
  <text x="615" y="330" font-size="12" text-anchor="middle" fill="#1a2332" font-family="'SFMono-Regular', Menlo, Consolas, monospace">mean_squared_error</text>
  <text x="615" y="350" font-size="12" text-anchor="middle" fill="#1a2332" font-family="'SFMono-Regular', Menlo, Consolas, monospace">mean_absolute_error</text>
  <text x="615" y="370" font-size="12" text-anchor="middle" fill="#1a2332" font-family="'SFMono-Regular', Menlo, Consolas, monospace">r2_score</text>

  <text x="24" y="414" font-size="12" fill="#94a3b8">지표를 실제로 계산하고 해석하는 방법은 Ch07에서 다룹니다.</text>
</svg>
