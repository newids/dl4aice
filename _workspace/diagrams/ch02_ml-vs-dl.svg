<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510" width="800" height="510" role="img" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <title>머신러닝 3줄 패턴과 딥러닝 4단계 패턴 — 같은 입력 데이터에서 sklearn은 생성, 학습, 예측 세 단계, Keras는 구성, 컴파일, 학습, 평가 네 단계로 갈린다</title>
  <defs>
    <marker id="ch02md-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1a2332"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="510" fill="#ffffff"/>

  <text x="24" y="40" font-size="20" font-weight="bold" fill="#1a2332">머신러닝 3줄 패턴과 딥러닝 4단계 패턴</text>

  <!-- 공통 입력 -->
  <rect x="250" y="66" width="300" height="56" rx="10" fill="#ffffff" stroke="#1a2332" stroke-width="1.5"/>
  <text x="400" y="90" font-size="14" text-anchor="middle" fill="#1a2332">공통 입력 데이터</text>
  <text x="400" y="112" font-size="12.5" text-anchor="middle" fill="#94a3b8" font-family="'SFMono-Regular', Menlo, Consolas, monospace">X_train_scaled, y_train</text>

  <path d="M400,122 V146 H60 V202" fill="none" stroke="#1a2332" stroke-width="2" marker-end="url(#ch02md-arrow)"/>
  <path d="M400,122 V146 H740 V202" fill="none" stroke="#1a2332" stroke-width="2" marker-end="url(#ch02md-arrow)"/>

  <text x="78" y="190" font-size="15" font-weight="bold" fill="#1a2332">머신러닝 (sklearn) — 3줄</text>
  <text x="722" y="190" font-size="15" font-weight="bold" text-anchor="end" fill="#2563eb">딥러닝 (Keras) — 4단계</text>

  <!-- ===== 1행 ===== -->
  <rect x="48" y="204" width="284" height="54" rx="10" fill="#ffffff" stroke="#1a2332" stroke-width="1.5"/>
  <text x="190" y="228" font-size="14.5" text-anchor="middle" fill="#1a2332">모델 생성</text>
  <text x="190" y="248" font-size="12" text-anchor="middle" fill="#94a3b8" font-family="'SFMono-Regular', Menlo, Consolas, monospace">RandomForestClassifier(...)</text>

  <rect x="468" y="204" width="284" height="54" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="610" y="228" font-size="14.5" text-anchor="middle" fill="#1a2332">구성</text>
  <text x="610" y="248" font-size="12" text-anchor="middle" fill="#1a2332">층을 쌓는다</text>
  <text x="742" y="220" font-size="11.5" text-anchor="end" fill="#2563eb">Ch04</text>

  <circle cx="400" cy="231" r="15" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="400" y="236" font-size="13" text-anchor="middle" fill="#94a3b8">1</text>

  <!-- ===== 2행 ===== -->
  <rect x="48" y="268" width="284" height="54" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="190" y="300" font-size="14" text-anchor="middle" fill="#94a3b8">해당 없음</text>

  <rect x="468" y="268" width="284" height="54" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="610" y="292" font-size="14.5" text-anchor="middle" fill="#1a2332">컴파일</text>
  <text x="610" y="312" font-size="12" text-anchor="middle" fill="#1a2332">optimizer · 손실 함수 · metrics</text>
  <text x="742" y="284" font-size="11.5" text-anchor="end" fill="#2563eb">Ch05</text>

  <circle cx="400" cy="295" r="15" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="400" y="300" font-size="13" text-anchor="middle" fill="#94a3b8">2</text>

  <!-- ===== 3행 ===== -->
  <rect x="48" y="332" width="284" height="54" rx="10" fill="#ffffff" stroke="#1a2332" stroke-width="1.5"/>
  <text x="190" y="356" font-size="14.5" text-anchor="middle" fill="#1a2332">학습</text>
  <text x="190" y="376" font-size="12" text-anchor="middle" fill="#94a3b8" font-family="'SFMono-Regular', Menlo, Consolas, monospace">model.fit(X_train_scaled, y_train)</text>

  <rect x="468" y="332" width="284" height="54" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="610" y="356" font-size="14.5" text-anchor="middle" fill="#1a2332">학습</text>
  <text x="610" y="376" font-size="12" text-anchor="middle" fill="#1a2332" font-family="'SFMono-Regular', Menlo, Consolas, monospace">fit(epochs, batch_size)</text>
  <text x="742" y="348" font-size="11.5" text-anchor="end" fill="#2563eb">Ch05</text>

  <circle cx="400" cy="359" r="15" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="400" y="364" font-size="13" text-anchor="middle" fill="#94a3b8">3</text>

  <!-- ===== 4행 ===== -->
  <rect x="48" y="396" width="284" height="54" rx="10" fill="#ffffff" stroke="#1a2332" stroke-width="1.5"/>
  <text x="190" y="420" font-size="14.5" text-anchor="middle" fill="#1a2332">예측</text>
  <text x="190" y="440" font-size="12" text-anchor="middle" fill="#94a3b8" font-family="'SFMono-Regular', Menlo, Consolas, monospace">model.predict(X_test_scaled)</text>

  <rect x="468" y="396" width="284" height="54" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="610" y="420" font-size="14.5" text-anchor="middle" fill="#1a2332">평가 · 예측</text>
  <text x="610" y="440" font-size="12" text-anchor="middle" fill="#1a2332" font-family="'SFMono-Regular', Menlo, Consolas, monospace">evaluate, predict</text>
  <text x="742" y="412" font-size="11.5" text-anchor="end" fill="#2563eb">Ch07</text>

  <circle cx="400" cy="423" r="15" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="400" y="428" font-size="13" text-anchor="middle" fill="#94a3b8">4</text>

  <text x="24" y="484" font-size="12.5" fill="#94a3b8">딥러닝은 머신러닝에 구성과 컴파일 두 단계가 더 붙습니다 — 실제 코드는 Ch04부터 작성합니다.</text>
</svg>
