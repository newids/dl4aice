<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 364" width="800" height="364" role="img" aria-label="validation_split이 데이터를 나누는 방식">
  <title>validation_split이 데이터를 나누는 방식 — 전체 데이터를 train_test_split으로 학습 70퍼센트와 평가 30퍼센트로 나눈 뒤, fit의 validation_split=0.2가 학습 데이터만 다시 80퍼센트 학습용과 20퍼센트 검증용으로 나눈다. 평가 데이터는 여기에 관여하지 않는다.</title>
  <defs>
    <marker id="vs-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="364" fill="#ffffff"/>

  <g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">

    <text x="32" y="38" font-size="20" font-weight="700" fill="#1a2332">validation_split이 데이터를 나누는 방식</text>

    <!-- 1단: 전체 데이터 -->
    <rect x="32" y="64" width="736" height="46" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="400" y="93" font-size="14" fill="#1a2332" text-anchor="middle">전체 데이터</text>

    <!-- 1단 to 2단 -->
    <text x="32" y="140" font-size="12" fill="#2563eb">train_test_split(test_size=0.3)</text>
    <line x1="289" y1="112" x2="289" y2="146" stroke="#94a3b8" stroke-width="2" marker-end="url(#vs-arrow)"/>
    <line x1="661" y1="112" x2="661" y2="146" stroke="#94a3b8" stroke-width="2" marker-end="url(#vs-arrow)"/>

    <!-- 2단: 학습 / 평가 -->
    <rect x="32" y="150" width="515" height="52" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="289" y="176" font-size="14" fill="#1a2332" text-anchor="middle">학습 데이터 (70%)</text>
    <text x="289" y="194" font-size="11" fill="#94a3b8" text-anchor="middle">X_train, y_train</text>

    <rect x="555" y="150" width="213" height="52" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="661" y="176" font-size="13" fill="#1a2332" text-anchor="middle">평가(테스트) 데이터 (30%)</text>
    <text x="661" y="194" font-size="11" fill="#94a3b8" text-anchor="middle">학습에 절대 쓰지 않음</text>

    <!-- 2단 to 3단 -->
    <text x="32" y="232" font-size="12" fill="#2563eb">fit(validation_split=0.2)</text>
    <line x1="238" y1="204" x2="238" y2="238" stroke="#94a3b8" stroke-width="2" marker-end="url(#vs-arrow)"/>
    <line x1="497" y1="204" x2="497" y2="238" stroke="#94a3b8" stroke-width="2" marker-end="url(#vs-arrow)"/>

    <!-- 3단: 학습 80 / 검증 20 -->
    <rect x="32" y="242" width="412" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="238" y="270" font-size="14" fill="#1a2332" text-anchor="middle">학습에 사용 (80%)</text>
    <text x="238" y="288" font-size="11" fill="#1a2332" text-anchor="middle">가중치를 실제로 갱신</text>

    <rect x="448" y="242" width="99" height="56" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <text x="497" y="270" font-size="13" fill="#1a2332" text-anchor="middle">검증 20%</text>
    <text x="497" y="288" font-size="11" fill="#f59e0b" text-anchor="middle">val_loss</text>

    <rect x="555" y="242" width="213" height="56" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="661" y="275" font-size="12" fill="#94a3b8" text-anchor="middle">관여하지 않음</text>

    <text x="32" y="326" font-size="12" fill="#94a3b8">validation_split은 학습 데이터의 뒤쪽 20%를 섞지 않고 그대로 잘라냅니다.</text>
    <text x="32" y="346" font-size="12" fill="#94a3b8">정렬된 데이터라면 미리 섞거나 validation_data로 직접 나눈 검증 세트를 전달하십시오.</text>
  </g>
</svg>
