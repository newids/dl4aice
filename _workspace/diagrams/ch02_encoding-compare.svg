<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <title>라벨 인코딩과 원-핫 인코딩의 결과 차이 — 라벨 인코딩은 없던 크기 관계를 만들고, 원-핫 인코딩은 0과 1 컬럼으로 나누어 크기 오해가 없다</title>
  <defs>
    <marker id="ch02ec-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1a2332"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="520" fill="#ffffff"/>

  <text x="24" y="40" font-size="20" font-weight="bold" fill="#1a2332">라벨 인코딩과 원-핫 인코딩의 결과 차이</text>

  <!-- ===== 원본 ===== -->
  <text x="36" y="92" font-size="15" font-weight="bold" fill="#1a2332">원본 (문자열)</text>

  <rect x="36" y="108" width="200" height="120" rx="10" fill="#ffffff" stroke="#1a2332" stroke-width="1.5"/>
  <line x1="36" y1="138" x2="236" y2="138" stroke="#1a2332" stroke-width="2"/>
  <line x1="36" y1="168" x2="236" y2="168" stroke="#94a3b8" stroke-width="1"/>
  <line x1="36" y1="198" x2="236" y2="198" stroke="#94a3b8" stroke-width="1"/>
  <text x="136" y="128" font-size="12.5" text-anchor="middle" fill="#94a3b8" font-family="'SFMono-Regular', Menlo, Consolas, monospace">contract_type</text>
  <text x="136" y="159" font-size="13" text-anchor="middle" fill="#1a2332" font-family="'SFMono-Regular', Menlo, Consolas, monospace">month</text>
  <text x="136" y="189" font-size="13" text-anchor="middle" fill="#1a2332" font-family="'SFMono-Regular', Menlo, Consolas, monospace">one_year</text>
  <text x="136" y="219" font-size="13" text-anchor="middle" fill="#1a2332" font-family="'SFMono-Regular', Menlo, Consolas, monospace">two_year</text>

  <!-- 화살표 -->
  <line x1="244" y1="168" x2="384" y2="168" stroke="#1a2332" stroke-width="2" marker-end="url(#ch02ec-arrow)"/>
  <path d="M244,210 H300 V390 H384" fill="none" stroke="#1a2332" stroke-width="2" marker-end="url(#ch02ec-arrow)"/>

  <!-- ===== 라벨 인코딩 ===== -->
  <text x="390" y="92" font-size="15" font-weight="bold" fill="#dc2626">라벨 인코딩</text>

  <rect x="390" y="108" width="170" height="120" rx="10" fill="#ffffff" stroke="#1a2332" stroke-width="1.5"/>
  <line x1="390" y1="138" x2="560" y2="138" stroke="#1a2332" stroke-width="2"/>
  <line x1="390" y1="168" x2="560" y2="168" stroke="#94a3b8" stroke-width="1"/>
  <line x1="390" y1="198" x2="560" y2="198" stroke="#94a3b8" stroke-width="1"/>
  <text x="475" y="128" font-size="12.5" text-anchor="middle" fill="#94a3b8" font-family="'SFMono-Regular', Menlo, Consolas, monospace">contract_type</text>
  <text x="475" y="159" font-size="13" text-anchor="middle" fill="#1a2332" font-family="'SFMono-Regular', Menlo, Consolas, monospace">0</text>
  <text x="475" y="189" font-size="13" text-anchor="middle" fill="#1a2332" font-family="'SFMono-Regular', Menlo, Consolas, monospace">1</text>
  <text x="475" y="219" font-size="13" text-anchor="middle" fill="#1a2332" font-family="'SFMono-Regular', Menlo, Consolas, monospace">2</text>

  <text x="390" y="254" font-size="12.5" fill="#dc2626">없던 크기 관계가 생김 — 0 &lt; 1 &lt; 2</text>

  <!-- 구분선 -->
  <line x1="310" y1="282" x2="776" y2="282" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- ===== 원-핫 인코딩 ===== -->
  <text x="390" y="314" font-size="15" font-weight="bold" fill="#059669">원-핫 인코딩 — get_dummies</text>

  <rect x="390" y="330" width="386" height="120" rx="10" fill="#ffffff" stroke="#1a2332" stroke-width="1.5"/>
  <line x1="390" y1="360" x2="776" y2="360" stroke="#1a2332" stroke-width="2"/>
  <line x1="390" y1="390" x2="776" y2="390" stroke="#94a3b8" stroke-width="1"/>
  <line x1="390" y1="420" x2="776" y2="420" stroke="#94a3b8" stroke-width="1"/>
  <line x1="519" y1="330" x2="519" y2="450" stroke="#94a3b8" stroke-width="1"/>
  <line x1="647" y1="330" x2="647" y2="450" stroke="#94a3b8" stroke-width="1"/>

  <text x="454" y="350" font-size="12.5" text-anchor="middle" fill="#94a3b8" font-family="'SFMono-Regular', Menlo, Consolas, monospace">_month</text>
  <text x="583" y="350" font-size="12.5" text-anchor="middle" fill="#94a3b8" font-family="'SFMono-Regular', Menlo, Consolas, monospace">_one_year</text>
  <text x="712" y="350" font-size="12.5" text-anchor="middle" fill="#94a3b8" font-family="'SFMono-Regular', Menlo, Consolas, monospace">_two_year</text>

  <text x="454" y="381" font-size="13" text-anchor="middle" fill="#059669" font-weight="bold" font-family="'SFMono-Regular', Menlo, Consolas, monospace">1</text>
  <text x="583" y="381" font-size="13" text-anchor="middle" fill="#94a3b8" font-family="'SFMono-Regular', Menlo, Consolas, monospace">0</text>
  <text x="712" y="381" font-size="13" text-anchor="middle" fill="#94a3b8" font-family="'SFMono-Regular', Menlo, Consolas, monospace">0</text>

  <text x="454" y="411" font-size="13" text-anchor="middle" fill="#94a3b8" font-family="'SFMono-Regular', Menlo, Consolas, monospace">0</text>
  <text x="583" y="411" font-size="13" text-anchor="middle" fill="#059669" font-weight="bold" font-family="'SFMono-Regular', Menlo, Consolas, monospace">1</text>
  <text x="712" y="411" font-size="13" text-anchor="middle" fill="#94a3b8" font-family="'SFMono-Regular', Menlo, Consolas, monospace">0</text>

  <text x="454" y="441" font-size="13" text-anchor="middle" fill="#94a3b8" font-family="'SFMono-Regular', Menlo, Consolas, monospace">0</text>
  <text x="583" y="441" font-size="13" text-anchor="middle" fill="#94a3b8" font-family="'SFMono-Regular', Menlo, Consolas, monospace">0</text>
  <text x="712" y="441" font-size="13" text-anchor="middle" fill="#059669" font-weight="bold" font-family="'SFMono-Regular', Menlo, Consolas, monospace">1</text>

  <text x="390" y="476" font-size="12.5" fill="#059669">크기 오해 없음 — 시험 기본 선택</text>
  <text x="390" y="496" font-size="12" fill="#94a3b8">(열 이름의 contract_type 접두사는 생략해 표기)</text>
</svg>
