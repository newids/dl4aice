<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <title>스케일링 전후 특성 분포의 변화 — 범위가 다른 두 특성은 한쪽으로 눌려 보이지만, 표준화 후에는 평균 0 표준편차 1로 균형이 맞는다</title>
  <defs>
    <marker id="ch02se-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1a2332"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="420" fill="#ffffff"/>

  <text x="24" y="40" font-size="20" font-weight="bold" fill="#1a2332">스케일링 전후 특성 분포의 변화</text>

  <!-- ===== 왼쪽: 스케일링 전 ===== -->
  <text x="60" y="76" font-size="15" font-weight="bold" fill="#94a3b8">스케일링 전</text>

  <line x1="70" y1="96" x2="70" y2="300" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="70" y1="300" x2="356" y2="300" stroke="#94a3b8" stroke-width="1.5"/>

  <rect x="86" y="256" width="270" height="40" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>

  <circle cx="100" cy="282" r="4.5" fill="#94a3b8"/>
  <circle cx="122" cy="274" r="4.5" fill="#94a3b8"/>
  <circle cx="140" cy="286" r="4.5" fill="#94a3b8"/>
  <circle cx="162" cy="276" r="4.5" fill="#94a3b8"/>
  <circle cx="184" cy="283" r="4.5" fill="#94a3b8"/>
  <circle cx="206" cy="272" r="4.5" fill="#94a3b8"/>
  <circle cx="228" cy="285" r="4.5" fill="#94a3b8"/>
  <circle cx="250" cy="277" r="4.5" fill="#94a3b8"/>
  <circle cx="272" cy="281" r="4.5" fill="#94a3b8"/>
  <circle cx="294" cy="273" r="4.5" fill="#94a3b8"/>
  <circle cx="316" cy="284" r="4.5" fill="#94a3b8"/>
  <circle cx="338" cy="278" r="4.5" fill="#94a3b8"/>

  <text x="44" y="200" font-size="12.5" text-anchor="middle" fill="#94a3b8" transform="rotate(-90 44 200)">특성 B (0 ~ 1)</text>
  <text x="213" y="322" font-size="12.5" text-anchor="middle" fill="#94a3b8">특성 A (0 ~ 1000)</text>
  <text x="213" y="348" font-size="12" text-anchor="middle" fill="#94a3b8">값이 큰 특성 A가 학습을 지배</text>

  <!-- 변환 화살표 -->
  <line x1="376" y1="200" x2="436" y2="200" stroke="#1a2332" stroke-width="2" marker-end="url(#ch02se-arrow)"/>
  <text x="406" y="188" font-size="12.5" text-anchor="middle" fill="#1a2332">표준화</text>

  <!-- ===== 오른쪽: 스케일링 후 ===== -->
  <text x="452" y="76" font-size="15" font-weight="bold" fill="#059669">스케일링 후 (StandardScaler)</text>

  <line x1="620" y1="96" x2="620" y2="304" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="462" y1="200" x2="778" y2="200" stroke="#94a3b8" stroke-width="1.5"/>

  <circle cx="620" cy="200" r="70" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>

  <circle cx="590" cy="175" r="4.5" fill="#059669"/>
  <circle cx="612" cy="160" r="4.5" fill="#059669"/>
  <circle cx="645" cy="180" r="4.5" fill="#059669"/>
  <circle cx="660" cy="205" r="4.5" fill="#059669"/>
  <circle cx="636" cy="225" r="4.5" fill="#059669"/>
  <circle cx="600" cy="215" r="4.5" fill="#059669"/>
  <circle cx="575" cy="198" r="4.5" fill="#059669"/>
  <circle cx="624" cy="192" r="4.5" fill="#059669"/>
  <circle cx="650" cy="155" r="4.5" fill="#059669"/>
  <circle cx="585" cy="232" r="4.5" fill="#059669"/>
  <circle cx="614" cy="240" r="4.5" fill="#059669"/>
  <circle cx="662" cy="228" r="4.5" fill="#059669"/>

  <text x="776" y="192" font-size="12" text-anchor="end" fill="#94a3b8">특성 A</text>
  <text x="630" y="106" font-size="12" fill="#94a3b8">특성 B</text>
  <text x="620" y="322" font-size="12.5" text-anchor="middle" fill="#94a3b8">평균 0, 표준편차 1</text>
  <text x="620" y="348" font-size="12" text-anchor="middle" fill="#059669">두 특성의 영향력이 대등해짐</text>

  <text x="24" y="392" font-size="12" fill="#94a3b8">개념 개략도입니다 — 실제 데이터 분포가 아닙니다.</text>
</svg>
